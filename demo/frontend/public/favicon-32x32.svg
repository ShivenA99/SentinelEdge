<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1E36"/>
      <stop offset="100%" style="stop-color:#0A1628"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Shield -->
  <path d="M7 6 L25 6 L25 19 Q25 27 16 30 Q7 27 7 19 Z" 
        fill="none" stroke="url(#shield)" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M7 6 L25 6 L25 19 Q25 27 16 30 Q7 27 7 19 Z" 
        fill="#0D9488" fill-opacity="0.1"/>

  <!-- Signal waveform - simplified for small size -->
  <line x1="9" y1="18" x2="11" y2="18" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="11,18 12.5,13 14,22 16,10 18,22 19.5,13 21,18" 
            fill="none" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="21" y1="18" x2="23" y2="18" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Glow dot at shield base -->
  <circle cx="16" cy="30" r="1" fill="#0D9488" opacity="0.8"/>
</svg>
