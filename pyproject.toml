[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentineledge"
version = "0.1.0"
description = "Federated Edge AI for Real-Time Phone Call Fraud Detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "onnxruntime>=1.16",
    "onnxmltools>=1.12",
    "skl2onnx>=1.16",
    "openai-whisper>=20231117",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "websockets>=12.0",
    "pydantic>=2.5",
    "PyNaCl>=1.5",
    "joblib>=1.3",
    "pandas>=2.1",
    "pyaudio>=0.2.14",
    "soundfile>=0.12",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["sentinel_edge*", "hub*", "federated*"]
